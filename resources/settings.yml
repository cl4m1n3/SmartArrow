# command settings to activate smart arrow mode
# Use commands? Specify false if you plan to use the plugin only as an API
command.status: true
# command name
command.name: smartarrow
# sub-commands
command.sub:
- sarrow

# smart arrow settings
# maximum boom capture range (in blocks)
capturing_target.max_distance: 150
# maximum arrow flight time (in seconds)
arrow.max_flight_time: 10